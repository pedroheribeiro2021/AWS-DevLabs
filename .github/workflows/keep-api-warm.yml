name: Keep API warm

# Render's free plan spins the API down after ~15 min without traffic, and the
# next request (usually a login) waits for it to boot again. Pinging /health
# every 10 min keeps it up during the hours the app is actually used. Limited
# to 07:00-23:59 BRT (10:00-02:59 UTC) so the service stays well inside
# Render's 750 free instance-hours per month. GitHub's scheduler can delay
# runs, so the login page also wakes the API on its own (see /api/wake).

on:
  schedule:
    # GitHub cron is always UTC: 10:00-02:59 UTC = 07:00-23:59 in Brasília (UTC-3).
    - cron: '*/10 0-2,10-23 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API health check
        run: curl --silent --show-error --fail --max-time 120 --retry 2 https://aws-devlab-api.onrender.com/health
